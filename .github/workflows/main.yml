name: CI PHP
on: [push]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Instalar dependências
        run: |
          composer install
          composer dump-autoload

      - name: Verificação de Estilo
        run: ./vendor/bin/phpcs --standard=PSR12 controller/ model/ || true

      - name: Rodar Testes
        run: ./vendor/bin/phpunit
